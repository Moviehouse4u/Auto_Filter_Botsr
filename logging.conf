[loggers]
keys=root,plugins,database,dreamxbotz

[handlers]
keys=consoleHandler

[formatters]
keys=consoleFormatter

[logger_root]
level=INFO
handlers=consoleHandler

[logger_plugins]
qualname=plugins
level=INFO
handlers=consoleHandler
propagate=0

[logger_dreamxbotz]
qualname=dreamxbotz
level=INFO
handlers=consoleHandler
propagate=0

[logger_database]
qualname=database
level=INFO
handlers=consoleHandler
propagate=0

[handler_consoleHandler]
class=StreamHandler
level=INFO
formatter=consoleFormatter
args=(ext://sys.stdout,)

[formatter_consoleFormatter]
format=%(asctime)s - %(lineno)d - %(name)s - %(module)s - %(levelname)s - %(message)s
datefmt=%I:%M:%S %p
